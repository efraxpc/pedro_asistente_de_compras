[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "pedro-infnet"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
ui = ["streamlit>=1.50,<2"]
agent = ["langchain-core>=1,<2", "langchain-classic>=1,<2", "langchain-openai>=1,<2", "langchain-community>=0.4,<1", "langchain-text-splitters>=1,<2", "faiss-cpu>=1.13,<2", "fastembed>=0.9,<1"]
nli = ["transformers>=4.50,<5", "torch>=2.6,<3"]
evaluation = ["langsmith>=0.4,<1"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "nbformat>=5,<6"]
dev = [
    "pytest>=8,<10",
    "nbformat>=5,<6",
    "reportlab>=4,<5",
]
comparacao = [
    "langchain>=1,<2",
    "langgraph>=1,<2",
    "langmem>=0.0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pedro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
