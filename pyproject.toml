[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "pedro-asistente-de-compras"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
agent = [
    "langchain-core>=1,<2",
    "langchain-classic>=1,<2",
    "langchain-openai>=1,<2",
    "langchain-community>=0.4,<1",
    "faiss-cpu>=1.13,<2",
    "numpy>=2,<3",
    "langsmith>=0.4,<1",
    "fastembed>=0.9,<1",
]
ui = ["streamlit>=1.50,<2"]
dev = ["pytest>=8,<10", "nbformat>=5,<6"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/compraslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
