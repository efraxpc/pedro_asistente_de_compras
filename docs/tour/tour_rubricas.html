<title>Tour de las rúbricas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Concepto: un plano de metro. Una línea con 10 paradas, un color por fase; debajo, la parada actual
   en tres columnas: la idea, el código real y un ejemplo real. */
:root {
  --fondo: #f3f5f9; --papel: #ffffff; --tinta: #14213d; --suave: #56627a; --linea: #d5dbe7;
  --codigo-fondo: #101a30; --codigo-tinta: #e6ecfb; --codigo-nota: #8fa0c4;
  --f1: #1f5fbf; --f2: #1c8a5a; --f3: #b86a00; --f4: #7a3fb0; --f5: #c0392b;
  --sobre-fase: #ffffff;
  --titulo: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --texto: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #0e1422; --papel: #171f33; --tinta: #eaf0ff; --suave: #a2aec8; --linea: #2c3854;
    --codigo-fondo: #0a101d; --codigo-tinta: #e6ecfb; --codigo-nota: #8fa0c4;
    --f1: #6ea8fe; --f2: #5fd3a0; --f3: #f2b45a; --f4: #c39bf0; --f5: #ff8f80;
    --sobre-fase: #0e1422; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fondo: #0e1422; --papel: #171f33; --tinta: #eaf0ff; --suave: #a2aec8; --linea: #2c3854;
  --codigo-fondo: #0a101d; --codigo-tinta: #e6ecfb; --codigo-nota: #8fa0c4;
  --f1: #6ea8fe; --f2: #5fd3a0; --f3: #f2b45a; --f4: #c39bf0; --f5: #ff8f80;
  --sobre-fase: #0e1422; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--fondo); color: var(--tinta); font-family: var(--texto); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 18px;
}
.pagina { max-width: 1220px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

.cabecera { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; }
.cabecera h1 { font-family: var(--titulo); font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
.cabecera p { margin: 0; color: var(--suave); font-size: 0.9rem; min-width: 0; }
.cabecera code { font-family: var(--mono); font-size: 0.86em; color: var(--tinta); }

/* Plano de la línea */
.plano { overflow-x: auto; padding: 2px; }
.linea { display: flex; min-width: 880px; list-style: none; margin: 0; padding: 0; }
.parada { flex: 1 1 0; position: relative; padding-top: 46px; text-align: center; }
.parada::before { content: ""; position: absolute; top: 18px; left: 0; right: 0; height: 6px; background: var(--c); }
.parada:first-child::before { left: 50%; border-radius: 3px 0 0 3px; }
.parada:last-child::before { right: 50%; border-radius: 0 3px 3px 0; }
.parada button {
  all: unset; cursor: pointer; display: block; width: 100%; font-family: var(--texto);
  font-size: 0.7rem; line-height: 1.2; color: var(--suave); padding: 0 4px 2px;
}
.parada button::before {
  content: attr(data-n); position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  width: 26px; height: 26px; border-radius: 50%; background: var(--papel); border: 4px solid var(--c);
  font-family: var(--titulo); font-weight: 700; font-size: 0.72rem; line-height: 18px; color: var(--tinta);
  transition: transform .35s ease, background .35s ease, color .35s ease;
}
.parada button:focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; border-radius: 6px; }
.parada.hecha button::before { background: var(--c); color: var(--sobre-fase); }
.parada.actual button { color: var(--tinta); font-weight: 600; }
.parada.actual button::before { background: var(--c); color: var(--sobre-fase); transform: translateX(-50%) scale(1.45); }

/* Parada actual */
.escena { background: var(--papel); border: 1px solid var(--linea); border-top: 6px solid var(--c); border-radius: 10px;
  padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 10px; }
.rotulo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.fase { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--c); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 0.7rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--c); color: var(--tinta); white-space: nowrap; }
.chip b { font-family: var(--titulo); color: var(--c); margin-right: 4px; }
.escena h2 { font-family: var(--titulo); font-size: clamp(1.3rem, 2.8vw, 1.8rem); line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -0.015em; }

.paneles { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; }
.panel { min-width: 0; display: flex; flex-direction: column; gap: 7px; transition: opacity .5s ease, transform .5s ease; }
.panel.oculto { opacity: 0; transform: translateY(8px); }
.panel h3 { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--suave); margin: 0; }
.panel p { margin: 0; }
.idea { font-size: 0.98rem; }
.analogia { color: var(--suave); font-size: 0.9rem; }
.archivo { font-family: var(--mono); font-size: 0.74rem; color: var(--c); overflow-wrap: anywhere; }
.codigo { margin: 0; background: var(--codigo-fondo); color: var(--codigo-tinta); border-radius: 8px; padding: 10px 12px;
  font-family: var(--mono); font-size: 0.74rem; line-height: 1.5; overflow-x: auto; tab-size: 4; }
.codigo .nota { color: var(--codigo-nota); }
.explica { font-size: 0.86rem; color: var(--suave); }
.caso { display: flex; flex-direction: column; gap: 5px; }
.caso div { font-size: 0.86rem; padding: 7px 10px; border-radius: 7px; border-left: 4px solid var(--c);
  background: color-mix(in srgb, var(--c) 11%, var(--papel)); overflow-wrap: anywhere; }
.caso b { display: block; font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--suave); font-weight: 600; }
.dato { font-size: 0.9rem; font-weight: 600; }

/* Subtítulo de la narración */
.subtitulo { min-height: 3.3em; margin: 0; padding: 8px 14px; border-radius: 8px; background: var(--tinta); color: var(--fondo);
  font-size: 0.95rem; line-height: 1.4; display: flex; align-items: center; }
.subtitulo:empty { visibility: hidden; }

/* Mandos */
.mandos { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.mandos button { font: 600 0.88rem var(--texto); color: var(--tinta); background: var(--papel); border: 1px solid var(--linea);
  border-radius: 8px; padding: 7px 13px; cursor: pointer; }
.mandos button.principal { background: var(--tinta); color: var(--fondo); border-color: var(--tinta); }
.mandos button[aria-pressed="true"] { border-color: var(--f1); color: var(--f1); }
.mandos button:focus-visible { outline: 2px solid var(--f1); outline-offset: 2px; }
.mandos button:disabled { opacity: .45; cursor: default; }
.cuenta { color: var(--suave); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.barra { flex: 1 1 140px; height: 6px; border-radius: 3px; background: var(--linea); overflow: hidden; }
.barra i { display: block; height: 100%; width: 0; background: var(--c); transition: width .4s ease; }

@media (max-width: 860px) {
  .paneles { grid-template-columns: minmax(0, 1fr); }
  .escena { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { .panel, .parada button::before, .barra i { transition: none; } }
</style>

<div class="pagina">
  <header class="cabecera">
    <h1>Tour de las rúbricas</h1>
    <p>Seguimos un mensaje por todo Pedro: <code>«Compare 5 unidades de PEC-01-0001 com prazo de 7 dias»</code></p>
  </header>

  <nav class="plano" aria-label="Paradas del recorrido"><ol class="linea" id="linea"></ol></nav>

  <main class="escena" id="escena">
    <div class="rotulo"><span class="fase" id="fase"></span><div class="chips" id="chips"></div></div>
    <h2 id="titulo"></h2>
    <div class="paneles">
      <section class="panel" id="p1"><h3>La idea</h3><p class="idea" id="idea"></p><p class="analogia" id="analogia"></p></section>
      <section class="panel" id="p2"><h3>El código real</h3><p class="archivo" id="archivo"></p><pre class="codigo" id="codigo"></pre><p class="explica" id="explica"></p></section>
      <section class="panel" id="p3"><h3>Ejemplo real</h3><div class="caso"><div><b>Entra</b><span id="entra"></span></div><div><b>Sale</b><span id="sale"></span></div></div><p class="dato" id="dato"></p></section>
    </div>
  </main>

  <p class="subtitulo" id="subtitulo" aria-live="polite"></p>

  <div class="mandos">
    <button type="button" id="anterior">← Anterior</button>
    <button type="button" id="reproducir" class="principal">▶ Reproducir</button>
    <button type="button" id="siguiente">Siguiente →</button>
    <button type="button" id="voz" aria-pressed="false">Voz: no</button>
    <span class="cuenta" id="cuenta"></span>
    <div class="barra" aria-hidden="true"><i id="avance"></i></div>
  </div>
</div>

<script>
const RUBRICAS = {
  R01: "Anatomía y tipo de agente", R02: "Planificación", R03: "Plantillas de prompt", R04: "Parser JSON",
  R05: "invoke, batch, stream", R06: "LCEL", R07: "Orquestadores", R08: "ReAct", R09: "Chains y router",
  R10: "API externa", R11: "PTCF y few-shot", R12: "Confiabilidad", R13: "Memorias CoALA",
  R14: "Ventana y vectores", R15: "Herramientas de memoria", R16: "Buffer de conversación",
  R17: "Intención y entidades", R18: "Contexto multi-turno", R19: "Herramientas fijas y semánticas",
  R20: "APIs internas y externas", R21: "Text-to-query", R22: "RAG con índice existente",
  R23: "Fallo de recuperación", R24: "Verificación y NLI", R25: "Un agente, varias fuentes",
  R26: "AgentExecutor", R27: "Historial por sesión", R28: "Streamlit", R29: "LangSmith"
};
const PARADAS = [
  { fase: 1, corto: "Texto a datos", titulo: "Del texto a los datos", rubricas: ["R03", "R04"],
    idea: "Una plantilla de prompt le pide al modelo un JSON, y un parser lo convierte en un objeto validado.",
    analogia: "Como un formulario: el modelo lo rellena y el parser revisa que esté completo.",
    archivo: "src/pedro/chains.py · criar_lcel",
    codigo: `def criar_lcel(modelo):
    parser = PydanticOutputParser(pydantic_object=Extracao)
    return (PROMPT.partial(formato=...)   <i class="nota"># R03: plantilla</i>
            | modelo
            | parser                      <i class="nota"># R04: valida el JSON</i>
            | RunnableLambda(_validar))`,
    explica: "Se lee de izquierda a derecha: plantilla, modelo, parser.",
    entra: "«Compare 5 unidades de PEC-01-0001 com prazo de 7 dias»",
    sale: "intencao = comparar · produto_id = PEC-01-0001 · quantidade = 5 · prazo_max_dias = 7",
    dato: "Si el modelo escribe «cinco» en vez de 5, el parser lo rechaza.",
    voz: ["Parada uno: del texto a los datos. El usuario escribe una frase normal, y Pedro necesita datos exactos: qué pieza, cuántas unidades y en qué plazo. Es como un formulario: el modelo lo rellena, y otra pieza revisa que esté completo.",
          "En el código es una sola cadena, que se lee de izquierda a derecha. Primero la plantilla de prompt, que es la rúbrica tres. Después el modelo. Y después el parser, que es la rúbrica cuatro: convierte la respuesta en un objeto de Python y lo valida.",
          "Ejemplo real. Entra la frase: compare cinco unidades de la pieza, con plazo de siete días. Sale un objeto con la intención comparar, la pieza, la cantidad cinco y el plazo siete. Si el modelo escribiera la cantidad con letras, el parser la rechazaría."] },
  { fase: 1, corto: "Tres formas de ejecutar", titulo: "Tres formas de ejecutar la misma cadena", rubricas: ["R05", "R06"],
    idea: "La misma cadena se ejecuta de una en una, varias a la vez o a trozos según llega la respuesta.",
    analogia: "Una caja del súper, tres cajas abiertas a la vez, o ver pasar los productos uno a uno.",
    archivo: "scripts/tour.py · parada_2",
    codigo: `cadeia = criar_lcel(modelo)
cadeia.invoke(pedido)              <i class="nota"># uno</i>
cadeia.batch(pedidos)              <i class="nota"># varios a la vez</i>
for pedaco in cadeia.stream(pedido):
    print(pedaco)                  <i class="nota"># a trozos</i>

@chain                             <i class="nota"># R06: la misma, imperativa</i>
def extrair(dado): return lcel.invoke(dado)`,
    explica: "invoke, batch y stream vienen gratis en cualquier cadena. @chain convierte una función normal en cadena.",
    entra: "Tres pedidos de compra distintos",
    sale: "invoke uno por uno: 4,6 s · batch: 1,4 s · mismos resultados",
    dato: "Con «|» cada paso se ve en la traza; con @chain el código se lee como Python normal.",
    voz: ["Parada dos: tres formas de ejecutar la misma cadena. Piensa en un supermercado. Puedes atender a un cliente cada vez, abrir tres cajas a la vez, o ir viendo pasar los productos uno a uno.",
          "En el código son tres métodos que cualquier cadena ya trae. Invoke procesa un pedido. Batch procesa varios en paralelo. Stream entrega la respuesta a trozos. Y el decorador chain, de la rúbrica seis, permite escribir la misma cadena como una función normal de Python.",
          "Ejemplo real, medido con el modelo. Tres pedidos, uno por uno, tardaron cuatro coma seis segundos. Los mismos tres con batch, uno coma cuatro segundos. Y el resultado fue idéntico."] },
  { fase: 1, corto: "El agente y su plan", titulo: "El agente: reglas, modelo y plan", rubricas: ["R01", "R02"],
    idea: "Pedro es híbrido: reglas fijas para lo simple y el modelo para lo abierto. Si el mensaje pide varias cosas, primero escribe un plan.",
    analogia: "Un recepcionista resuelve lo rutinario y pasa lo difícil al especialista.",
    archivo: "src/pedro/agent.py · resolver",
    codigo: `direta = consulta_direta(cenario, pergunta)
if direta is not None:             <i class="nota"># capa reactiva: reglas</i>
    return AIMessage(content=direta)
...
executor = criar_agente(...)       <i class="nota"># capa deliberativa: modelo</i>
saida = executor.invoke({"input": entrada, ...})`,
    explica: "Primero los «if» con reglas. Solo si ninguna responde, se llama al modelo.",
    entra: "«Liste as peças»  ·  «A que cidade corresponde o CEP 01001000?»",
    sale: "La primera la responde una regla, sin modelo. En la segunda el modelo elige la herramienta consultar_cep.",
    dato: "Un mensaje con tres peticiones se divide en un plan de tres pasos (planner.py).",
    voz: ["Parada tres: el agente. Pedro es un agente híbrido. Tiene reglas fijas para lo simple, y usa el modelo para lo abierto. Es como un recepcionista que resuelve lo rutinario y pasa lo difícil al especialista.",
          "En el código se ve muy claro. Primero hay condiciones con reglas: si una regla sabe responder, responde y termina. Esa es la capa reactiva. Solo si ninguna regla responde, se crea el agente y se llama al modelo. Esa es la capa deliberativa.",
          "Ejemplo real. Si escribes: liste las piezas, responde una regla, sin gastar una llamada al modelo. Si preguntas por un código postal, el modelo decide usar la herramienta de consulta. Y si un mensaje pide tres cosas, primero se escribe un plan de tres pasos. Esa es la rúbrica dos."] },
  { fase: 2, corto: "Herramientas", titulo: "Herramientas: pensar, actuar, observar", rubricas: ["R07", "R08", "R09", "R10"],
    idea: "El agente no se sabe los datos: los pide. Piensa qué necesita, llama a una herramienta, lee el resultado y repite.",
    analogia: "Un cocinero que mira la despensa antes de cada paso.",
    archivo: "src/pedro/business.py · comparar (extracto)",
    codigo: `for oferta in ofertas:
    total = quantidade * preco_unitario + frete
    if oferta.estoque &lt; quantidade:
        motivos.append("estoque")
    if quantidade &lt; oferta.pedido_minimo:
        motivos.append("pedido_minimo")
    if oferta.prazo_dias &gt; prazo_max_dias:
        motivos.append("prazo")`,
    explica: "Es lo que ejecuta la herramienta comparar_ofertas: cálculo fijo, en centavos enteros.",
    entra: "5 unidades de PEC-01-0001, plazo máximo 7 días",
    sale: "CentroPeças R$ 7.279,83: cumple. Litoral Parts: sin stock y fuera de plazo. Atlantic: 35 días, fuera de plazo.",
    dato: "Otra herramienta es una API externa: consultar_cep devuelve São Paulo/SP para el CEP 01001000.",
    voz: ["Parada cuatro: las herramientas. El modelo no se sabe los precios ni el stock. Los tiene que pedir. Piensa qué necesita, llama a una herramienta, lee el resultado y repite. Ese ciclo se llama ReAct. Es como un cocinero que mira la despensa antes de cada paso.",
          "Este es el código de la herramienta más importante: comparar ofertas. Para cada proveedor calcula el total, y lo descarta si no tiene stock, si no llega al pedido mínimo, o si tarda más del plazo. Es cálculo fijo. El modelo solo decide cuándo llamarla.",
          "Ejemplo real: cinco unidades con plazo de siete días. Centro Peças cumple, con siete mil doscientos setenta y nueve reales. Litoral Parts no tiene stock. Atlantic tarda treinta y cinco días. Otra herramienta consulta una API externa de códigos postales, que es la rúbrica diez."] },
  { fase: 2, corto: "Prompts y registro", titulo: "Prompts que funcionan y fallos a la vista", rubricas: ["R11", "R12"],
    idea: "Un buen prompt dice Persona, Tarea, Contexto y Formato, y da ejemplos. Y cada paso del agente queda registrado.",
    analogia: "Explicar una tarea con ejemplos, y llevar un cuaderno de lo que salió mal.",
    archivo: "src/pedro/prompts.py · MODELO_AGENTE (extracto)",
    codigo: `("system",
 "Persona: Pedro, assistente de compras fictícias. "
 "Tarefa: em compras, esclareça somente produto e "
 "quantidade quando faltarem; ... "
 "Contexto: ... a solicitação atual prevalece. "
 "Formato: JSON RespostaCompra válido. "
 "Não invente dados nem fontes. ...")`,
    explica: "Las cuatro etiquetas son PTCF. Después van seis ejemplos resueltos (few-shot).",
    entra: "Las mismas 10 solicitudes, con tres versiones del prompt",
    sale: "Sin ejemplos: 6 de 10 bien. Con ejemplos: 10 de 10. Con ejemplos y razonamiento: 10 de 10.",
    dato: "La clase Rastro (agent.py) guarda cada herramienta, cada verificación y cada error.",
    voz: ["Parada cinco: prompts que funcionan. Un buen prompt tiene cuatro partes: persona, tarea, contexto y formato. Y además da ejemplos resueltos. Es como explicarle una tarea a alguien nuevo: le dices quién es, qué debe hacer, y le enseñas ejemplos.",
          "Este es el prompt real del agente. Mira las cuatro etiquetas: persona, tarea, contexto y formato. Después vienen seis ejemplos. A dar ejemplos se le llama few-shot.",
          "Ejemplo real, con las mismas diez solicitudes. Sin ejemplos, el modelo acertó seis de diez. Con ejemplos, diez de diez. Y la rúbrica doce: cada paso queda registrado en una clase llamada Rastro, para saber por qué algo falló."] },
  { fase: 3, corto: "Cuatro memorias", titulo: "Cuatro memorias", rubricas: ["R13", "R14", "R15", "R16"],
    idea: "El modelo solo ve los últimos 12 mensajes. Lo demás se guarda fuera y se recupera cuando hace falta.",
    analogia: "La mesa de trabajo, el diario, la agenda y el manual.",
    archivo: "src/pedro/memory.py",
    codigo: `JANELA_MENSAGENS = 12            <i class="nota"># lo que ve el modelo</i>

def salvar_preferencia(caminho, user_id, chave, valor,
                       *, explicita): ...

def recuperar(caminho, user_id, pergunta, embedder,
              k=3): ...          <i class="nota"># 3 recuerdos parecidos</i>`,
    explica: "Ventana para lo reciente, búsqueda por similitud para lo antiguo, y preferencias que duran entre sesiones.",
    entra: "«Prefiro fornecedores nacionais, lembre-se disso» y después «Compare 2 unidades de PEC-11-0001»",
    sale: "Guarda fornecedor = nacionais. Recomienda Casa Técnica Brasil (R$ 1.970,38), nacional, aunque Atlantic costaba R$ 619,38.",
    dato: "La preferencia la aplica el sistema, no el modelo.",
    voz: ["Parada seis: la memoria. El modelo solo ve los últimos doce mensajes. Todo lo demás se guarda fuera. Hay cuatro memorias: la mesa de trabajo, con lo que estamos haciendo; el diario, con lo que pasó; la agenda, con tus preferencias; y el manual, con las reglas.",
          "En el código, una constante fija la ventana en doce mensajes. Una función guarda tus preferencias, solo si las dijiste de forma explícita. Y otra recupera los tres recuerdos más parecidos a la pregunta actual.",
          "Ejemplo real. El usuario dice: prefiero proveedores nacionales, recuérdalo. Pedro lo guarda. Después pide comparar otra pieza, y Pedro recomienda un proveedor nacional, aunque uno internacional era más barato. Y avisa de que aplicó la preferencia."] },
  { fase: 3, corto: "Entender la conversación", titulo: "Entender la conversación", rubricas: ["R17", "R18"],
    idea: "Pedro detecta qué quieres y los datos que diste, y los mantiene de un turno al siguiente.",
    analogia: "Un vendedor que recuerda tu pedido cuando dices «mejor que sean 6».",
    archivo: "src/pedro/dialogue.py · MudancaSolicitacao",
    codigo: `class MudancaSolicitacao(BaseModel):
    e_compra: bool                 <i class="nota"># ¿es una compra?</i>
    quantidade: int | None
    orcamento_centavos: int | None

const NOMBRE_FASE = ["", "Fase 1 · Chain y arquitectura", "Fase 2 · Agente con herramientas", "Fase 3 · Chatbot con memoria",
  "Fase 4 · SQL, APIs y RAG", "Fase 5 · Agente final"];

const el = (id) => document.getElementById(id);
const paneles = [el("p1"), el("p2"), el("p3")];
let actual = 0, reloj = null, reproduciendo = false, conVoz = false;
const habla = "speechSynthesis" in window ? window.speechSynthesis : null;

el("linea").innerHTML = PARADAS.map((p, i) =>
  `<li class="parada" style="--c: var(--f${p.fase})"><button type="button" data-n="${i + 1}" data-i="${i}">${p.corto}</button></li>`).join("");

function pintar(i, visibles = 3, subtitulo = "") {
  actual = i;
  const p = PARADAS[i], color = `var(--f${p.fase})`;
  for (const zona of [el("escena"), el("avance")]) zona.style.setProperty("--c", color);
  el("fase").textContent = `Parada ${i + 1} de ${PARADAS.length} · ${NOMBRE_FASE[p.fase]}`;
  el("chips").innerHTML = p.rubricas.map((r) => `<span class="chip"><b>${r}</b>${RUBRICAS[r]}</span>`).join("");
  el("titulo").textContent = p.titulo;
  el("idea").textContent = p.idea;
  el("analogia").textContent = p.analogia;
  el("archivo").textContent = p.archivo;
  el("codigo").innerHTML = p.codigo;
  el("explica").textContent = p.explica;
  el("entra").textContent = p.entra;
  el("sale").textContent = p.sale;
  el("dato").textContent = p.dato;
  el("subtitulo").textContent = subtitulo;
  paneles.forEach((panel, n) => panel.classList.toggle("oculto", n >= visibles));
  document.querySelectorAll(".parada").forEach((li, n) => {
    li.classList.toggle("actual", n === i);
    li.classList.toggle("hecha", n < i);
    if (n === i) li.querySelector("button").setAttribute("aria-current", "step");
    else li.querySelector("button").removeAttribute("aria-current");
  });
  const hechas = PARADAS.slice(0, i + 1).reduce((suma, x) => suma + x.rubricas.length, 0);
  el("cuenta").textContent = `${hechas} de 29 rúbricas`;
  el("avance").style.width = `${(hechas / 29) * 100}%`;
  el("anterior").disabled = i === 0;
  el("siguiente").disabled = i === PARADAS.length - 1;
  document.querySelector(".parada.actual")?.scrollIntoView({ block: "nearest", inline: "center" });
}

function parar() {
  reproduciendo = false;
  clearTimeout(reloj);
  if (habla) habla.cancel();
  el("reproducir").textContent = "▶ Reproducir";
  pintar(actual, 3);
}
function paso(i, visibles) {
  const texto = PARADAS[i].voz[visibles - 1];
  pintar(i, visibles, texto);
  let avanzado = false;
  const seguir = () => {
    if (avanzado || !reproduciendo) return;
    avanzado = true;
    clearTimeout(reloj);
    if (visibles < 3) return paso(i, visibles + 1);
    if (i < PARADAS.length - 1) return paso(i + 1, 1);
    parar();
  };
  const lectura = texto.length * 68 + 1200;  // tiempo para leer el subtítulo
  if (conVoz && habla) {
    const frase = new SpeechSynthesisUtterance(texto);
    frase.lang = "es-ES";
    frase.rate = 1;
    frase.onend = () => setTimeout(seguir, 500);
    habla.speak(frase);
    reloj = setTimeout(seguir, lectura * 1.8);  // por si la voz no avisa al terminar
  } else {
    reloj = setTimeout(seguir, lectura);
  }
}
function reproducir(desde = actual) {
  reproduciendo = true;
  el("reproducir").textContent = "⏸ Pausar";
  paso(desde, 1);
}

el("reproducir").addEventListener("click", () => (reproduciendo ? parar() : reproducir(actual === PARADAS.length - 1 ? 0 : actual)));
el("anterior").addEventListener("click", () => { parar(); pintar(Math.max(0, actual - 1)); });
el("siguiente").addEventListener("click", () => { parar(); pintar(Math.min(PARADAS.length - 1, actual + 1)); });
el("voz").addEventListener("click", () => {
  if (!habla) { el("voz").textContent = "Voz: no disponible aquí"; el("voz").disabled = true; return; }
  conVoz = !conVoz;
  el("voz").setAttribute("aria-pressed", String(conVoz));
  el("voz").textContent = conVoz ? "Voz: sí" : "Voz: no";
  if (!conVoz) habla.cancel();
});
el("linea").addEventListener("click", (evento) => {
  const boton = evento.target.closest("button");
  if (boton) { parar(); pintar(Number(boton.dataset.i)); }
});
document.addEventListener("keydown", (evento) => {
  if (evento.key === "ArrowRight") el("siguiente").click();
  if (evento.key === "ArrowLeft") el("anterior").click();
});

window.tour = { pintar, reproducir, parar, total: PARADAS.length, voces: PARADAS.map((p) => p.voz) };
pintar(0, 3);
</script>
