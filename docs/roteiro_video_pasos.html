<title>Guion de grabación Pedro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Concepto: un apuntador de grabación. Una pantalla por paso: arriba, dónde vas; en el centro, lo que
   haces (recuadro verde azulado, fuera de micrófono) y lo que dices (letra grande, rojo de «en el aire»);
   abajo, dos botones grandes para retroceder y avanzar. */
:root {
  --bg: #eceff3; --surface: #ffffff; --ink: #151e29; --muted: #566273; --line: #cfd7e0;
  --do: #0b6563; --do-soft: #dcefee; --say: #a3231a; --say-soft: #fbe6e3; --ok: #1c6a39; --ok-soft: #e0f1e5;
  --warn: #7a5200; --warn-soft: #fbefd2; --focus: #1b5fc1; --on-strong: #ffffff;
  --ui: "Inter", "Segoe UI", system-ui, sans-serif;
  --read: "Atkinson Hyperlegible", "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --say-size: 1.7rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --surface: #18202a; --ink: #e9eef4; --muted: #9daab9; --line: #2e3947;
    --do: #58cbc6; --do-soft: #13302f; --say: #ff8f85; --say-soft: #3a1b18; --ok: #6fd192; --ok-soft: #15301f;
    --warn: #f0c060; --warn-soft: #33290f; --focus: #8ab8ff; --on-strong: #0f141b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #18202a; --ink: #e9eef4; --muted: #9daab9; --line: #2e3947;
  --do: #58cbc6; --do-soft: #13302f; --say: #ff8f85; --say-soft: #3a1b18; --ok: #6fd192; --ok-soft: #15301f;
  --warn: #f0c060; --warn-soft: #33290f; --focus: #8ab8ff; --on-strong: #0f141b; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.5;
       display: flex; flex-direction: column; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.dentro { width: 100%; max-width: 60rem; margin-inline: auto;
          padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ---- cabecera ---- */
.barra { background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
.barra .dentro { padding-block: 10px; display: flex; flex-direction: column; gap: 8px; }
.donde { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.donde h1 { margin: 0; font-size: 1.05rem; font-weight: 700; text-wrap: balance; }
.donde .tiempo { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.9rem; }
.avance { display: flex; align-items: center; gap: 10px; }
.avance .pista { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 0; }
.avance .hecho { height: 100%; width: 0; background: var(--do); }
.avance .cuenta { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mandos { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mandos select, .mandos button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 0.9rem; min-height: 38px; }
.mandos select { max-width: 100%; min-width: 0; flex: 1 1 14rem; }
.mandos button[aria-pressed="true"] { background: var(--do-soft); border-color: var(--do); color: var(--do); font-weight: 600; }
.crono { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.crono output { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 1rem; min-width: 3.4em; text-align: right; }

/* ---- escena ---- */
main { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
main .dentro { padding-block: 22px 28px; display: flex; flex-direction: column; gap: 22px; }
.paso { display: flex; flex-direction: column; gap: 18px; }
.rotulo { margin: 0; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.rotulo .porque { color: var(--warn); }
.bloque { display: flex; flex-direction: column; gap: 14px; }
.bloque + .bloque { border-top: 1px dashed var(--line); padding-top: 18px; }
.etq { display: inline-block; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
       padding: 3px 10px; border-radius: 999px; color: var(--on-strong); }
.etq small { font-weight: 500; letter-spacing: 0.04em; text-transform: none; }
.haz { background: var(--do-soft); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.haz .etq { background: var(--do); align-self: flex-start; }
.haz p { margin: 0; font-size: 1.15rem; line-height: 1.45; max-width: 65ch; }
.escribe { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.escribe code { font-family: var(--mono); font-size: 1rem; flex: 1 1 14rem; min-width: 0; overflow-wrap: anywhere; user-select: all; }
.escribe button { border: 1px solid var(--do); background: var(--do); color: var(--on-strong); border-radius: 8px; padding: 8px 14px; font-weight: 600; min-height: 40px; }
.di { display: flex; flex-direction: column; gap: 10px; }
.di .etq { background: var(--say); align-self: flex-start; }
.di .frase { margin: 0; font-family: var(--read); font-size: var(--say-size); line-height: 1.35; max-width: 34em; overflow-wrap: break-word; }
.sig { margin: 0; color: var(--muted); font-size: 1rem; max-width: 70ch; }
.sig b { color: var(--ink); font-weight: 600; }
.aviso { margin: 0; border-radius: 10px; padding: 10px 14px; font-size: 1rem; max-width: 70ch; }
.aviso.ver { background: var(--ok-soft); color: var(--ok); }
.aviso.ver b { font-family: var(--mono); font-size: 1.1rem; }
.aviso.nota { background: var(--warn-soft); color: var(--warn); }
.lista h2 { margin: 0 0 4px; font-size: 1.5rem; text-wrap: balance; }
.lista .ayuda { margin: 0 0 14px; color: var(--muted); }
.lista ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.lista label { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 1.05rem; cursor: pointer; }
.lista input { width: 22px; height: 22px; flex: none; margin-top: 2px; accent-color: var(--do); }
.lista span { min-width: 0; overflow-wrap: anywhere; }
.lista input:checked + span { color: var(--muted); text-decoration: line-through; }
.titulo-parte { margin: 18px 0 0; font-size: 1.35rem; padding-top: 18px; border-top: 2px solid var(--ink); text-wrap: balance; }
.titulo-parte small { color: var(--muted); font-weight: 400; font-size: 0.95rem; }
.todo .paso { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }

/* ---- pie ---- */
.pie { background: var(--surface); border-top: 1px solid var(--line); flex: none; }
.pie .dentro { display: flex; gap: 12px; padding-block: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.pie button { border-radius: 12px; min-height: 58px; font-size: 1.15rem; font-weight: 700; border: 1px solid var(--line); background: var(--bg); padding: 8px 18px; }
.pie .ant { flex: 1 1 30%; }
.pie .sig-btn { flex: 2 1 60%; background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pie button:disabled { opacity: 0.4; cursor: default; }
@media (max-width: 520px) {
  :root { --say-size: 1.4rem; }
  .haz p { font-size: 1.05rem; }
  .crono { margin-left: 0; }
  .mandos select { flex: 1 1 100%; }
  .pie button { font-size: 1rem; padding-inline: 10px; }
}
</style>

<header class="barra">
  <div class="dentro">
    <div class="donde">
      <h1 id="donde">Antes de grabar</h1>
      <span class="tiempo" id="tiempo"></span>
    </div>
    <div class="avance">
      <div class="pista" aria-hidden="true"><div class="hecho" id="hecho"></div></div>
      <span class="cuenta" id="cuenta"></span>
    </div>
    <div class="mandos">
      <select id="ir" aria-label="Ir a una parte del guion"></select>
      <button type="button" id="menos" aria-label="Letra más pequeña">A−</button>
      <button type="button" id="mas" aria-label="Letra más grande">A+</button>
      <button type="button" id="ver-sig" aria-pressed="true">Significado</button>
      <button type="button" id="ver-todo" aria-pressed="false">Ver todo</button>
      <div class="crono">
        <output id="reloj" aria-label="Tiempo de grabación">00:00</output>
        <button type="button" id="crono-ir">Iniciar</button>
        <button type="button" id="crono-cero" aria-label="Poner el cronómetro a cero">Cero</button>
      </div>
    </div>
  </div>
</header>

<main id="escena" tabindex="-1"><div class="dentro" id="contenido"></div></main>

<footer class="pie" id="pie">
  <div class="dentro">
    <button type="button" class="ant" id="anterior">← Anterior</button>
    <button type="button" class="sig-btn" id="siguiente">Siguiente →</button>
  </div>
</footer>

<script>
const GUION = {"pantallas": [{"tipo": "lista", "clave": "antes", "titulo": "Antes de grabar", "items": ["Ejecuta ./project.sh restart y abre http://localhost:8501. El sello debe decir «Agente ativo».", "Haz una pregunta cualquiera antes de grabar. La primera respuesta tarda, porque Pedro carga dos modelos locales.", "Pulsa «Novo chat». Las sugerencias solo aparecen con el chat vacío.", "Deja abiertos: el informe (docs/efrain_colmenares_ai-agents_langchain-agents.pdf), el README, la página pública de LangSmith, una terminal en la carpeta del proyecto y el editor con la carpeta src/pedro.", "Comprueba que se ven a la vez la pantalla y tu webcam (Loom u OBS).", "Opcional: añade la línea PEDRO_TRUST_POLICY_INDEX=true al archivo .env y reinicia. Así no sale el aviso amarillo «Revise a procedência do índice…» al abrir los pasos."], "ayuda": "Marca cada punto. Cuando estén todos, empieza a grabar y pulsa Siguiente."}, {"tipo": "paso", "num": 1, "parte": 1, "tituloParte": "Apertura", "tiempo": "0:00 a 0:45", "primeroDeParte": true, "bloques": [{"haz": "Mira a la cámara. Deja el chat de Pedro abierto y vacío.", "di": ["Olá, professor.", "Meu nome é Efrain Colmenares e esta é a apresentação do meu projeto da disciplina Agentes Cognitivos com LangChain."], "sig": "Hola, profesor. Me llamo Efrain Colmenares y esta es la presentación de mi proyecto de la asignatura Agentes Cognitivos con LangChain."}]}, {"tipo": "paso", "num": 2, "parte": 1, "tituloParte": "Apertura", "tiempo": "0:00 a 0:45", "primeroDeParte": false, "bloques": [{"haz": "Señala el chat con el ratón.", "di": ["Dei ao projeto o nome de Pedro.", "O Pedro é um assistente de compras de peças de eletrodomésticos: ele compara fornecedores e recomenda o melhor.", "Todos os dados são fictícios.", "A API externa é o ViaCEP, uma API pública de CEP."], "sig": "Al proyecto le puse el nombre de Pedro. Pedro es un asistente de compras de piezas de electrodomésticos: compara proveedores y recomienda el mejor. Todos los datos son ficticios. La API externa es ViaCEP, una API pública de códigos postales."}]}, {"tipo": "paso", "num": 3, "parte": 1, "tituloParte": "Apertura", "tiempo": "0:00 a 0:45", "primeroDeParte": false, "bloques": [{"haz": "No toques nada. Mira a la cámara y di el porqué.", "di": ["Escolhi este domínio porque comparar fornecedores depende de dados que mudam, como preço e estoque.", "Por isso ele precisa de um agente com ferramentas, e não só de uma chain.", "E escolhi o ViaCEP porque é uma API aberta, que não pede chave."], "sig": "Elegí este dominio porque comparar proveedores depende de datos que cambian, como precio y stock. Por eso necesita un agente con herramientas, y no solo una chain. Y elegí ViaCEP porque es una API abierta, que no pide clave.", "porque": true}]}, {"tipo": "paso", "num": 4, "parte": 2, "tituloParte": "Qué resuelve el agente", "tiempo": "0:45 a 2:15", "primeroDeParte": true, "bloques": [{"haz": "Abre el informe en el apartado 5, «Caracterização do domínio escolhido». Deja a la vista la tabla del ejemplo.", "di": ["O Pedro resolve três coisas.", "Primeiro, compara: cada peça tem três ofertas, e ele descarta as que não têm estoque, não atingem o pedido mínimo, passam do prazo ou do orçamento.", "Segundo, orienta: busca nas políticas da loja com busca semântica e cita a fonte.", "Terceiro, lembra: guarda o pedido da conversa e as preferências do usuário."], "sig": "Pedro resuelve tres cosas. Primero, compara: cada pieza tiene tres ofertas, y descarta las que no tienen stock, no llegan al pedido mínimo, pasan del plazo o del presupuesto. Segundo, orienta: busca en las políticas de la tienda con búsqueda semántica y cita la fuente. Tercero, recuerda: guarda el pedido de la conversación y las preferencias del usuario."}]}, {"tipo": "paso", "num": 5, "parte": 2, "tituloParte": "Qué resuelve el agente", "tiempo": "0:45 a 2:15", "primeroDeParte": false, "bloques": [{"haz": "Baja al apartado 6, «Decisões técnicas e justificativas, fase a fase».", "di": ["Uma mensagem passa por cinco passos.", "O Pedro entende o pedido.", "O agente escolhe a ferramenta.", "A ferramenta calcula.", "O sistema coloca os números do cálculo na resposta.", "E a resposta é verificada antes de aparecer."], "sig": "Un mensaje pasa por cinco pasos. Pedro entiende el pedido. El agente elige la herramienta. La herramienta calcula. El sistema pone las cifras del cálculo en la respuesta. Y la respuesta se verifica antes de aparecer."}]}, {"tipo": "paso", "num": 6, "parte": 2, "tituloParte": "Qué resuelve el agente", "tiempo": "0:45 a 2:15", "primeroDeParte": false, "bloques": [{"haz": "No toques nada. Sigue en el mismo apartado.", "di": ["Usei três modelos.", "O gpt-4.1-mini, da OpenAI, conversa e escolhe as ferramentas.", "Um modelo local de embeddings faz a busca semântica no FAISS.", "E um modelo local de NLI, o mDeBERTa, confere se a resposta é sustentada pelos dados.", "O modelo de conversa é configurável: pelo arquivo .env ele pode ser trocado por um modelo local no Ollama.", "Nesta demonstração uso o gpt-4.1-mini."], "sig": "Usé tres modelos. El gpt-4.1-mini, de OpenAI, conversa y elige las herramientas. Un modelo local de embeddings hace la búsqueda semántica en FAISS. Y un modelo local de NLI, el mDeBERTa, comprueba si la respuesta está respaldada por los datos. El modelo de conversación es configurable: con el archivo .env se puede cambiar por un modelo local en Ollama. En esta demostración uso el gpt-4.1-mini."}]}, {"tipo": "paso", "num": 7, "parte": 2, "tituloParte": "Qué resuelve el agente", "tiempo": "0:45 a 2:15", "primeroDeParte": false, "bloques": [{"haz": "No toques nada. Mira a la cámara y di el porqué.", "di": ["Separei assim porque um modelo de linguagem pode errar contas.", "O modelo decide o que responder, mas os números quem coloca é o sistema.", "E usei SQLite porque não exige instalar um servidor de banco de dados; fica mais fácil para quem for avaliar."], "sig": "Lo separé así porque un modelo de lenguaje puede equivocarse const P = GUION.pantallas;
const $ = (id) => document.getElementById(id);
const CLAVE = "guion-pedro:";

function leer(clave, porDefecto) {
  try { const v = localStorage.getItem(CLAVE + clave); return v === null ? porDefecto : JSON.parse(v); }
  catch (e) { return porDefecto; }
}
function guardar(clave, valor) {
  try { localStorage.setItem(CLAVE + clave, JSON.stringify(valor)); } catch (e) { /* sin almacenamiento: la página funciona igual */ }
}
function crear(etiqueta, clase, texto) {
  const el = document.createElement(etiqueta);
  if (clase) el.className = clase;
  if (texto !== undefined) el.textContent = texto;
  return el;
}

let actual = Math.min(Math.max(0, leer("paso", 0)), P.length - 1);
let verTodo = false;
let verSig = leer("sig", true);
let tam = leer("tam", null);
let marcas = leer("marcas", {});

function bloque(b) {
  const caja = crear("div", "bloque");
  const haz = crear("section", "haz");
  haz.append(crear("span", "etq", "Haz"), crear("p", "", b.haz));
  if (b.escribe) {
    const fila = crear("div", "escribe");
    const codigo = crear("code", "", b.escribe);
    const boton = crear("button", "", "Copiar");
    boton.type = "button";
    boton.addEventListener("click", () => copiar(b.escribe, codigo, boton));
    fila.append(codigo, boton);
    haz.append(fila);
  }
  caja.append(haz);
  const di = crear("section", "di");
  const etq = crear("span", "etq", "Di ");
  etq.append(crear("small", "", "en portugués"));
  di.append(etq);
  for (const frase of b.di) di.append(crear("p", "frase", frase));
  caja.append(di);
  if (b.sig) {
    const sig = crear("p", "sig");
    sig.append(crear("b", "", "Significa: "), document.createTextNode(b.sig));
    sig.hidden = !verSig;
    caja.append(sig);
  }
  if (b.comprueba) {
    const ver = crear("p", "aviso ver", "Debe verse en pantalla: ");
    ver.append(crear("b", "", b.comprueba));
    caja.append(ver);
  }
  if (b.nota) {
    const nota = crear("p", "aviso nota");
    nota.append(crear("b", "", "Si sale distinto. "), document.createTextNode(b.nota));
    caja.append(nota);
  }
  return caja;
}

function tarjeta(pantalla) {
  if (pantalla.tipo === "lista") {
    const caja = crear("section", "lista");
    caja.append(crear("h2", "", pantalla.titulo), crear("p", "ayuda", pantalla.ayuda));
    const ul = crear("ul");
    pantalla.items.forEach((texto, i) => {
      const id = pantalla.clave + "-" + i;
      const li = crear("li"), etiqueta = crear("label"), casilla = crear("input");
      casilla.type = "checkbox"; casilla.id = id; casilla.checked = !!marcas[id];
      casilla.addEventListener("change", () => { marcas[id] = casilla.checked; guardar("marcas", marcas); });
      etiqueta.htmlFor = id;
      etiqueta.append(casilla, crear("span", "", texto));
      li.append(etiqueta); ul.append(li);
    });
    caja.append(ul);
    return caja;
  }
  const art = crear("article", "paso");
  const rotulo = crear("p", "rotulo", "Paso " + pantalla.num + " de " + GUION.totalPasos);
  if (pantalla.bloques.some((b) => b.porque)) rotulo.append(crear("span", "porque", " · el porqué"));
  art.append(rotulo);
  pantalla.bloques.forEach((b) => art.append(bloque(b)));
  return art;
}

function pintar() {
  const cont = $("contenido");
  cont.replaceChildren();
  cont.classList.toggle("todo", verTodo);
  $("pie").hidden = verTodo;
  if (verTodo) {
    P.forEach((pantalla) => {
      if (pantalla.tipo === "paso" && pantalla.primeroDeParte) {
        const h = crear("h2", "titulo-parte", "Parte " + pantalla.parte + ". " + pantalla.tituloParte + " ");
        h.append(crear("small", "", pantalla.tiempo));
        cont.append(h);
      }
      cont.append(tarjeta(pantalla));
    });
  } else {
    cont.append(tarjeta(P[actual]));
  }
  const pantalla = P[actual];
  if (verTodo) {
    $("donde").textContent = "Guion completo";
    $("tiempo").textContent = GUION.totalPartes + " partes · " + GUION.totalPasos + " pasos";
  } else if (pantalla.tipo === "paso") {
    $("donde").textContent = "Parte " + pantalla.parte + " de " + GUION.totalPartes + " · " + pantalla.tituloParte;
    $("tiempo").textContent = pantalla.tiempo;
  } else {
    $("donde").textContent = pantalla.titulo;
    $("tiempo").textContent = "";
  }
  const hechos = pantalla.tipo === "paso" ? pantalla.num : (actual === 0 ? 0 : GUION.totalPasos);
  $("hecho").style.width = (100 * hechos / GUION.totalPasos) + "%";
  $("cuenta").textContent = pantalla.tipo === "paso" ? "Paso " + pantalla.num + " de " + GUION.totalPasos : (actual === 0 ? "Sin empezar" : "Terminado");
  $("anterior").disabled = actual === 0;
  $("siguiente").disabled = actual === P.length - 1;
  $("siguiente").textContent = actual === 0 ? "Empezar →" : "Siguiente →";
  $("ir").value = String(inicioDeSeccion(actual));
  $("ver-sig").setAttribute("aria-pressed", String(verSig));
  $("ver-todo").setAttribute("aria-pressed", String(verTodo));
  if (!verTodo) $("escena").scrollTop = 0;
}

function inicioDeSeccion(i) {
  let j = i;
  while (j > 0 && !(P[j].tipo === "lista" || P[j].primeroDeParte)) j--;
  return j;
}
function ir(i) {
  actual = Math.min(Math.max(0, i), P.length - 1);
  guardar("paso", actual);
  pintar();
}

async function copiar(texto, codigo, boton) {
  try {
    await navigator.clipboard.writeText(texto);
    boton.textContent = "Copiado";
  } catch (e) {
    const rango = document.createRange();
    rango.selectNodeContents(codigo);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(rango);
    boton.textContent = "Seleccionado: cópialo";
  }
  setTimeout(() => { boton.textContent = "Copiar"; }, 2200);
}

// Lista de partes para saltar.
P.forEach((pantalla, i) => {
  if (pantalla.tipo === "lista" || pantalla.primeroDeParte) {
    const op = crear("option", "", pantalla.tipo === "lista" ? pantalla.titulo
      : "Parte " + pantalla.parte + ". " + pantalla.tituloParte + " (" + pantalla.tiempo + ")");
    op.value = String(i);
    $("ir").append(op);
  }
});
$("ir").addEventListener("change", (e) => { verTodo = false; ir(Number(e.target.value)); });
$("anterior").addEventListener("click", () => ir(actual - 1));
$("siguiente").addEventListener("click", () => { mantenerPantalla(); ir(actual + 1); });
$("ver-sig").addEventListener("click", () => { verSig = !verSig; guardar("sig", verSig); pintar(); });
$("ver-todo").addEventListener("click", () => { verTodo = !verTodo; pintar(); });

// Tamaño de la letra de lo que se dice.
function aplicarTam() { if (tam) document.documentElement.style.setProperty("--say-size", tam + "rem"); }
function cambiarTam(delta) {
  const base = tam || parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--say-size")) || 1.7;
  tam = Math.min(2.8, Math.max(1.1, Math.round((base + delta) * 10) / 10));
  guardar("tam", tam); aplicarTam();
}
$("menos").addEventListener("click", () => cambiarTam(-0.2));
$("mas").addEventListener("click", () => cambiarTam(0.2));

// Cronómetro de la grabación.
let inicio = null, acumulado = 0, tic = null;
function pintarReloj() {
  const seg = Math.floor((acumulado + (inicio ? Date.now() - inicio : 0)) / 1000);
  $("reloj").textContent = String(Math.floor(seg / 60)).padStart(2, "0") + ":" + String(seg % 60).padStart(2, "0");
}
$("crono-ir").addEventListener("click", () => {
  if (inicio) { acumulado += Date.now() - inicio; inicio = null; clearInterval(tic); $("crono-ir").textContent = "Seguir"; }
  else { inicio = Date.now(); tic = setInterval(pintarReloj, 500); $("crono-ir").textContent = "Pausar"; mantenerPantalla(); }
  pintarReloj();
});
$("crono-cero").addEventListener("click", () => {
  clearInterval(tic); inicio = null; acumulado = 0; $("crono-ir").textContent = "Iniciar"; pintarReloj();
});

// Que la pantalla no se apague mientras se graba, donde el navegador lo permita.
let bloqueo = null;
async function mantenerPantalla() {
  if (bloqueo || !("wakeLock" in navigator)) return;
  try { bloqueo = await navigator.wakeLock.request("screen"); bloqueo.addEventListener("release", () => { bloqueo = null; }); }
  catch (e) { bloqueo = null; }
}

// Teclado: flechas, AvPág y RePág, y espacio fuera de los controles.
document.addEventListener("keydown", (e) => {
  if (verTodo || e.altKey || e.ctrlKey || e.metaKey) return;
  const enControl = /^(BUTTON|SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName);
  if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && !enControl)) { e.preventDefault(); ir(actual + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); ir(actual - 1); }
});

aplicarTam();
pintar();
</script>
